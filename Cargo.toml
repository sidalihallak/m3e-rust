[package]
name = "m3e-rust-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Material 3 Expressive components for Dioxus, with Material color themes generated from a seed color"
repository = "https://github.com/sidalihallak/m3e-rust"
readme = "README.md"
keywords = ["dioxus", "material", "material-design", "ui", "components"]
categories = ["gui", "wasm"]

[dependencies]
dioxus = { version = "0.7" }
material-colors = { version = "0.5", default-features = false, features = ["std", "quantize"] }

[features]
default = ["web"]
web = ["dioxus/web"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
