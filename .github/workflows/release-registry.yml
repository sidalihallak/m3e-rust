name: Prepare GitHub registry release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag matching Cargo.toml (e.g. v0.1.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
  package:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Validate and package version
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          python3 scripts/package-registry.py --version "${RELEASE_TAG#v}" --output dist
      - name: Prepare draft release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "M3E Rust ${RELEASE_TAG}" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS dist/release.json --clobber
